<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine de Produtos</title>
  <style>
    :root {
      --primary-color: #111827;
      --accent-color: #059669;
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--primary-color);
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--accent-color);
      background-color: #ecfdf5;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      width: fit-content;
    }

    .title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1rem;
      min-height: 2.8rem;
    }

    .price-container {
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }

    .price-main {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-color);
    }

    .price-tag {
      font-size: 0.8rem;
      color: var(--accent-color);
      font-weight: 600;
    }

    .price-pix3x {
      margin-top: 0.4rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .price-pix3x strong {
      color: var(--primary-color);
    }

    .price-total-installment {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Catálogo de Produtos</h1>
    </header>

    <div class="grid" id="catalog-grid">
      <!-- Os cards serão inseridos aqui via JS -->
    </div>
  </div>

  <script>
    // Formatador para Moeda Brasileira (R$)
    const formatCurrency = (value) => {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      }).format(value);
    };

    // Função para renderizar o catálogo
    function renderCatalog(items) {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = '';

      items.forEach(item => {
        const parcelValue = item.precoPix3x / 3;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <span class="category">${item.categoria}</span>
            <h2 class="title">${item.nome}</h2>
          </div>
          <div class="price-container">
            <div class="price-main">${formatCurrency(item.precoNovo)}</div>
            <div class="price-tag">à vista no Pix</div>
            
            <div class="price-pix3x">
              ou <strong>3x de ${formatCurrency(parcelValue)}</strong> no Pix
            </div>
            <span class="price-total-installment">(Total: ${formatCurrency(item.precoPix3x)})</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Carregar os dados do arquivo JSON gerado
    fetch('catalogo_arredondado.json')
      .then(response => response.json())
      .then(data => renderCatalog(data))
      .catch(error => console.error('Erro ao carregar o catálogo:', error));
  </script>

</body>
</html>
